[pytest]
# pytest configuration for the Fridai UI automation suite.
# Python Playwright is configured via pytest options + conftest fixtures + env vars
# (Python Playwright does NOT use a playwright.config.py file).

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short
    # Default browser; override on the CLI with `--browser firefox` or `--browser webkit`.
    --browser=chromium
    # Headed mode is opt-in via `--headed`. Default is headless for CI parity.
    # Screenshot/video/trace on failure only — keeps artifact volume sane.
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure

markers =
    smoke: critical happy-path checks; must pass on every PR
    regression: full regression sweep; runs nightly
    critical: top-priority business flows; blocking if broken
    negative: negative / error-path scenarios
    boundary: boundary or edge-case scenarios
    ux: UX-focused checks (visuals, copy, layout)
    slow: long-running tests; excluded from smoke

# Base URL is read from BASE_URL env var by tests/conftest.py.
# CI overrides via env, not via this file.
